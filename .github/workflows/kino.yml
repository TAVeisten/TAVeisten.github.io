name: Kinoprogram Drammen

on:
  schedule:
    # Kl. 07:19 norsk tid hele året. GitHub bruker UTC, så begge står her, og «Sjekk tidspunkt»
    # lar bare den som treffer 07:19 i Norge den dagen kjøre (sommertid / vintertid).
    # Ferdig etter ca. 1–2 minutter; resten er margin hvis GitHub starter for sent.
    - cron: "19 5 * * *"
    - cron: "19 6 * * *"
  workflow_dispatch: {}   # «Oppdater nå» på siden, eller Run workflow på GitHub
  push:
    branches: [main]
    paths: ["kino/update.py", "kino/overrides.json", ".github/workflows/kino.yml"]

permissions:
  contents: write

concurrency:
  group: kino
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sjekk tidspunkt
        id: check
        run: |
          off=$(TZ=Europe/Oslo date +%z)
          case "${{ github.event.schedule }}" in
            "19 5 * * *") [ "$off" = "+0200" ] && echo run=true >> $GITHUB_OUTPUT || echo "Vintertid – venter på neste" ;;
            "19 6 * * *") [ "$off" = "+0100" ] && echo run=true >> $GITHUB_OUTPUT || echo "Sommertid – kjørte forrige" ;;
            *) echo run=true >> $GITHUB_OUTPUT ;;
          esac
      - uses: actions/checkout@v4
        if: steps.check.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true'
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
        if: steps.check.outputs.run == 'true'
      - run: python -u kino/update.py
        if: steps.check.outputs.run == 'true'
      - name: Lagre data
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "kino-oppdatering"
          git config user.email "actions@users.noreply.github.com"
          git add kino/data.json
          git commit -m "Kinoprogram oppdatert" || exit 0
          git pull --rebase origin main
          git push
