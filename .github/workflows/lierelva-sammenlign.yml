name: Lierelva sammenligning (engangs)
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["lierelva/sammenlign.py", ".github/workflows/lierelva-sammenlign.yml"]
permissions:
  contents: write
jobs:
  cmp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - run: python -u lierelva/sammenlign.py
      - run: |
          git config user.name "lierelva-oppdatering"
          git config user.email "actions@users.noreply.github.com"
          git add lierelva/sammenligning.json
          git commit -m "Lierelva: sammenligning Excel mot lierelva.com" || exit 0
          git pull --rebase origin main
          git push
