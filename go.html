<script>
// Videresender til en Claude-side. Brukes på iPhone/iPad slik at siden åpnes
// i nettleseren i full størrelse i stedet for i forhåndsvisningen i Claude-appen.
(function(){
  var u = new URLSearchParams(location.search).get("u") || "";
  if (/^https:\/\/claude\.ai\/artifact\/[A-Za-z0-9_-]+$/.test(u)) {
    location.replace(u);
  } else {
    location.replace("./");
  }
})();
</script>
